
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="No hem trobat aquesta pàgina. Torna a la pàgina principal de la farmàcia."
  >

  <meta name="robots" content="noindex, follow">

  <title>Pàgina no trobada | Farmàcia</title>

  <link rel="stylesheet" href="../assets/css/404.css">
</head>

<body>
  <main class="error-page">

    <a class="brand" href="../index.html" aria-label="Tornar a l'inici">
      <span class="brand__symbol" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path
            d="M16 5v22M5 16h22"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="brand__name">FARMÀCIA</span>
    </a>

    <section class="error-content" aria-labelledby="error-title">

      <div class="error-illustration" aria-hidden="true">

        <span class="spark spark--one">✳</span>
        <span class="spark spark--two">✦</span>
        <span class="spark spark--three">·</span>

        <svg
          class="capsule"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 180 150"
          fill="none"
        >
          <defs>
            <clipPath id="capsule-clip">
              <rect
                x="33"
                y="51"
                width="114"
                height="48"
                rx="24"
              />
            </clipPath>

            <linearGradient
              id="capsule-shine"
              x1="42"
              y1="51"
              x2="138"
              y2="99"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#FFFFFF" stop-opacity=".7"/>
              <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <g class="capsule__body" clip-path="url(#capsule-clip)">
            <rect
              x="33"
              y="51"
              width="114"
              height="48"
              rx="24"
              fill="#D9E7CE"
            />

            <path
              d="M57 51H33v48h24a24 24 0 0 0 0-48Z"
              fill="#315E4B"
            />

            <path
              d="M90 51v48"
              stroke="#FFFFFF"
              stroke-opacity=".85"
              stroke-width="2"
            />

            <rect
              x="33"
              y="51"
              width="114"
              height="48"
              rx="24"
              fill="url(#capsule-shine)"
            />
          </g>

          <rect
            x="33"
            y="51"
            width="114"
            height="48"
            rx="24"
            stroke="#FFFFFF"
            stroke-width="3"
          />
        </svg>

        <span class="illustration-shadow"></span>
      </div>

      <p class="eyebrow">
        <span class="eyebrow__dot"></span>
        ERROR 404 · PÀGINA NO TROBADA
      </p>

      <h1 id="error-title">
        Ens hem perdut<br>
        <span>de camí.</span>
      </h1>

      <p class="error-description">
        Sembla que aquesta pàgina s'ha perdut.
        Però no pateixis, t'ajudem a trobar
        el que busques.
      </p>

      <a class="home-button" href="../index.html">
        <span>Tornar a l'inici</span>

        <svg
          class="home-button__arrow"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5 12h14m-6-6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>

      <p class="help-text">
        Encara necessites ajuda?
        <a href="../index.html#contacte">Contacta amb nosaltres</a>
      </p>

    </section>

    <footer class="error-footer">
      <span>La teva farmàcia de confiança</span>
      <span class="footer-dot" aria-hidden="true"></span>
      <span>Som aquí per ajudar-te.</span>
    </footer>

  </main>
</body>
</html>
